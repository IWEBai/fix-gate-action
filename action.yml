name: "Fix Gate"
description: "Verifies a security-fix pull request: finding gone, nothing new, files parse, tests pass, guard holds against known bypasses. Rule-based, on your runner."
author: "Railo"
branding:
  icon: "check-square"
  color: "green"

inputs:
  github_token:
    description: "Token used to create the check run. The automatic GITHUB_TOKEN with checks: write is enough."
    required: false
    default: ${{ github.token }}
  base_branch:
    description: "Branch the pull request targets. Leave empty to use the pull request's base branch."
    required: false
    default: ""
  rule:
    description: "Rule id of the finding this pull request fixes (for example python-sqli-fstring). With file, names the targeted finding instead of inferring it."
    required: false
    default: ""
  file:
    description: "Path of the file the targeted finding is in."
    required: false
    default: ""
  line:
    description: "Line of the targeted finding at base, to pick between several in one file."
    required: false
    default: ""
  alert:
    description: "Number of a code-scanning alert this pull request fixes. Targets its file and line (and its rule when the alert came from Railo). Needs security-events: read."
    required: false
    default: ""
  sarif_base:
    description: "Path to a SARIF file from another tool's scan of the base commit (CodeQL, Snyk, Semgrep). Each of its findings in the changed files must be matched by a Railo finding (same file, same CWE or line) that is gone at head; one Railo's rules do not match is reported as not run, never as gone."
    required: false
    default: ""
  comment:
    description: "'true' also posts the verdict as one pull request comment, edited in place on later runs. Needs pull-requests: write."
    required: false
    default: "false"
  require_resolved:
    description: "'true' fails the gate when no base finding was resolved at all, so a change that fixes nothing cannot pass as a fix."
    required: false
    default: "false"
  tests_result:
    description: "Your test job's outcome (success, failure, skipped); pass the needs.<job>.result expression. Without it the tests row is reported as not run."
    required: false
    default: ""
  timeout:
    description: "Seconds allowed for the two scans. A scan that runs out of time is reported as not run, never as a pass."
    required: false
    default: "120"
  fail_on_failure:
    description: "'false' reports a failed gate without failing the job."
    required: false
    default: "true"
  fail_on_not_run:
    description: "'true' makes the conclusion failure, not neutral, when the finding or new rows could not run (scan timed out or crashed, more than 200 changed files, base commit not found, the ignore file changed, an external finding Railo's rules do not match). Empty means true when rule, file, line, alert or sarif_base is given or require_resolved is true, and false otherwise. Rows not run by design (tests without tests_result, a language without a parser, guard_bypass off) never fail the gate."
    required: false
    default: ""
  guard_bypass:
    description: "'true' runs the validator function the pull request adds against Railo's published list of known bypass payloads for its weakness class, in a restricted subprocess on your runner, on pull_request events only. 'false' leaves that row as not run."
    required: false
    default: "true"

outputs:
  conclusion:
    description: "success, failure or neutral"
  finding:
    description: "pass, fail, neutral or not_run: the targeted finding is gone"
  new:
    description: "pass, fail or not_run: nothing new in the changed lines"
  parse:
    description: "pass, fail, neutral or not_run: the changed files still parse"
  tests:
    description: "pass, fail, neutral or not_run: the tests did not newly fail"
  guard:
    description: "pass, fail, neutral or not_run: the validator the change added rejected every listed bypass"

runs:
  using: "docker"
  # Railo engine v2.9.0, pinned by digest so this tag always runs the same image.
  image: "docker://ghcr.io/iwebai/railo@sha256:99b854ddd046e6d8446e75db76d1666ce9ea3e53c0449901b5a55557f09596e6"
  env:
    GITHUB_TOKEN: ${{ inputs.github_token }}
    INPUT_MODE: "fix-gate"
    INPUT_BASE_BRANCH: ${{ inputs.base_branch }}
    INPUT_RULE: ${{ inputs.rule }}
    INPUT_FILE: ${{ inputs.file }}
    INPUT_LINE: ${{ inputs.line }}
    INPUT_ALERT: ${{ inputs.alert }}
    INPUT_SARIF_BASE: ${{ inputs.sarif_base }}
    INPUT_COMMENT: ${{ inputs.comment }}
    INPUT_REQUIRE_RESOLVED: ${{ inputs.require_resolved }}
    INPUT_TESTS_RESULT: ${{ inputs.tests_result }}
    INPUT_TIMEOUT: ${{ inputs.timeout }}
    INPUT_FAIL_ON_FAILURE: ${{ inputs.fail_on_failure }}
    INPUT_FAIL_ON_NOT_RUN: ${{ inputs.fail_on_not_run }}
    INPUT_GUARD_BYPASS: ${{ inputs.guard_bypass }}
